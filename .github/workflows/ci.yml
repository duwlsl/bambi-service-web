name: CI

# service-web(Next.js) PR 자동 검사
# main / develop 로 향하는 PR과 해당 브랜치 push 시 실행

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 같은 브랜치에서 새 커밋이 오면 이전 실행은 취소 (CI 시간 절약)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # lockfile 기준 결정적 설치
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 타입 검사 (build 전 조기 실패)
      - name: Typecheck
        run: npx tsc --noEmit

      # 브라우저가 필요 없는 테스트 — 같은 job 에서 돈다(설치 결과 재사용, 중복 npm ci 없음).
      #   npm test = test:legacy(node --test, tests/*.test.mjs) + test:unit(vitest run)
      # 빌드보다 앞에 두는 건 더 싼 검사에서 먼저 떨어뜨리기 위해서다.
      - name: Test (node:test + Vitest)
        run: npm test

      # 프로덕션 빌드 검증. API_URL 은 빌드 통과용 더미(런타임 값 아님)
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost

  # E2E 는 브라우저·프로덕션 서버 기동이 필요해 위 job 과 분리한다. 분리 비용은 npm ci 1회
  # 중복(캐시 적중 시 수십 초)이고, 그 대신 lint·typecheck·test·build 결과가 브라우저 설치를
  # 기다리지 않고 먼저 나온다. 실패 판정은 두 job 이 독립적이다.
  e2e:
    name: E2E (Playwright · Chromium)
    runs-on: ubuntu-latest
    # webServer(빌드+기동)까지 포함해도 충분한 상한. 멈춘 실행이 기본 6시간을 태우지 않게 한다.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium 만 설치한다(--with-deps 로 리눅스 런타임 의존성 포함). 다른 브라우저는 받지 않는다.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts 가 webServer 로 next build + next start(포트 3100)를 직접 띄우고,
      # 모든 /api/** 요청은 테스트가 page.route 로 stub 한다 — 운영/로컬 백엔드에 접근하지 않는다.
      - name: Run E2E
        run: npm run test:e2e

      # 실패했을 때만 근거를 남긴다(성공 실행에는 artifact 를 만들지 않는다).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git 히스토리 전체를 스캔하기 위해

      # gitleaks: API Key / .env / 토큰이 커밋됐는지 검사
      # 도커 이미지는 오픈소스·무료 (조직 라이선스 불필요)
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --redact --verbose
