name: CI

# service-web(Next.js) 자동 검사 — lint · typecheck · 단위 테스트 · 빌드 · E2E · 시크릿 스캔
# main 으로 향하는 PR과 main push 에서 실행하고, 필요하면 수동으로도 돌린다.
#
# 이 저장소는 팀 원본의 개인 Fork 라 브랜치가 main 하나뿐이다. 원본에 있던 develop 트리거는
# 이 Fork 에 대응 브랜치가 없어 영원히 발동하지 않으므로 뺐다(죽은 설정을 남기지 않는다).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 검사만 하는 워크플로라 저장소 읽기 외의 권한이 필요 없다. 최소 권한을 최상위에 두어
# 모든 job 이 같은 기본값을 상속한다(job 이 늘어도 권한이 조용히 넓어지지 않는다).
permissions:
  contents: read

# 같은 브랜치에서 새 커밋이 오면 이전 실행은 취소 (CI 시간 절약)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # lockfile 기준 결정적 설치
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 타입 검사 (build 전 조기 실패)
      - name: Typecheck
        run: npx tsc --noEmit

      # 브라우저가 필요 없는 테스트 — 같은 job 에서 돈다(설치 결과 재사용, 중복 npm ci 없음).
      # 빌드보다 앞에 두는 건 더 싼 검사에서 먼저 떨어뜨리기 위해서다.
      #
      # ⚠️ `npm test`(= test:legacy && test:unit)를 그대로 부르지 않는 이유:
      #    test:legacy 의 `node --test "tests/*.test.mjs"` 는 **Node 22+ 에서만** 글롭이 확장된다.
      #    이 CI 의 Node 20 에서는 리터럴 경로로 읽혀 "Could not find" 로 실패한다(실측).
      #    여기서는 셸이 글롭을 펼쳐 `tests/*.test.mjs` 전부를 실행한다 — 실행 대상은 동일하다.
      #    파일·케이스가 늘어도 글롭이 그대로 집어가므로 개수는 적어 두지 않는다(적어 두면 늘어난
      #    순간부터 이름과 주석이 거짓이 된다 — 실제 개수는 실행 로그가 말한다).
      #    근본 해결은 package.json 의 test:legacy 를 Node 20 호환으로 고치는 것이고(예: `node --test tests/`),
      #    package.json 수정은 이 작업 범위 밖이라 후속으로 남긴다.
      - name: Test (node:test)
        run: node --test tests/*.test.mjs

      # jsdom 은 Node 20 을 공식 지원하는 라인(#112)이라 이 job 의 Node 20 에서 그대로 돈다.
      - name: Test (Vitest, RTL·MSW)
        run: npm run test:unit

      # 프로덕션 빌드 검증. API_URL 은 빌드 통과용 더미(런타임 값 아님)
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost

  # E2E 는 브라우저·프로덕션 서버 기동이 필요해 위 job 과 분리한다. 분리 비용은 npm ci 1회
  # 중복(캐시 적중 시 수십 초)이고, 그 대신 lint·typecheck·test·build 결과가 브라우저 설치를
  # 기다리지 않고 먼저 나온다. 실패 판정은 두 job 이 독립적이다.
  e2e:
    name: E2E (Playwright · Chromium)
    runs-on: ubuntu-latest
    # webServer(빌드+기동)까지 포함해도 충분한 상한. 멈춘 실행이 기본 6시간을 태우지 않게 한다.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium 만 설치한다(--with-deps 로 리눅스 런타임 의존성 포함). 다른 브라우저는 받지 않는다.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts 가 webServer 로 next build + next start(포트 3100)를 직접 띄우고,
      # 모든 /api/** 요청은 테스트가 page.route 로 stub 한다 — 운영/로컬 백엔드에 접근하지 않는다.
      - name: Run E2E
        run: npm run test:e2e

      # 실패했을 때만 근거를 남긴다(성공 실행에는 artifact 를 만들지 않는다).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git 히스토리 전체를 스캔하기 위해

      # gitleaks: API Key / .env / 토큰이 커밋됐는지 검사
      # 도커 이미지는 오픈소스·무료 (조직 라이선스 불필요)
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --redact --verbose
