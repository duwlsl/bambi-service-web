name: Docker Build

# 개인 Fork 전용 — **Dockerfile 이 빌드되는지만 검증한다.**
#
# 원본 팀 저장소에서 이 워크플로는 CD 였다: GHCR 로그인 → 이미지 push → 조직 저장소
# (bambi-build)의 배포 워크플로를 PAT 로 dispatch → 서버 반영. 그 동작은 팀 인프라와
# 시크릿을 전제로 하므로 **개인 Fork 에서 실행되면 안 된다** — 남의 조직 저장소를 건드리고,
# 시크릿이 없으면 실패만 남기며, 성공하면 더 나쁘다(의도치 않은 배포).
#
# 그래서 이 Fork 에서는 배포 역할을 전부 제거하고 빌드 검증만 남겼다.
# 하지 않는 것(의도적으로 전부 삭제됨):
#   - GHCR 등 레지스트리 로그인 · 이미지 push
#   - hk-toss-final-project 등 외부 저장소 workflow dispatch
#   - CD_TRIGGER_PAT 을 비롯한 배포 시크릿 사용
#   - 서버 배포
# 팀 프로젝트 당시 CD 를 운영한 기록은 Git 이력과 README 에 남아 있다. 여기서는 재현하지 않는다.
#
# 새 배포 대상은 추가하지 않는다 — 배포처가 정해지지 않았으므로 현재는 CI 까지만 구성한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 빌드만 하므로 저장소 읽기 외의 권한이 필요 없다.
# (원본에는 이미지 push 를 위한 packages: write 가 있었다 — push 를 없앴으니 함께 제거한다.)
permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (verify only)
    runs-on: ubuntu-latest
    # 의존성 설치 + next build 를 이미지 안에서 다시 수행하므로 CI job 보다 오래 걸린다.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # push: false — 만들어진 이미지는 러너 밖으로 나가지 않는다.
      # tag 에 레지스트리 호스트를 두지 않아(로컬 이름) 실수로도 어딘가로 밀릴 수 없다.
      #
      # NEXT_PUBLIC_* build-arg 는 넘기지 않는다. 값을 비운 채 빌드하는 것이 운영 설정과
      # 같고(CLAUDE.md §6 — 빈 값이면 same-origin `/api/*`), 저장소 변수 없이도 이 검증이
      # 그대로 돌아야 하기 때문이다. 캐시(type=gha)도 쓰지 않는다 — 빌드 검증에 필요한
      # 동작이 아니고, 실패 지점을 하나라도 줄이는 편이 Fork 에서 다루기 쉽다.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bambi-service-web:ci
