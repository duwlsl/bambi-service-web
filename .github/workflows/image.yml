name: Build & Push image

# 프론트 Docker 이미지 빌드 → GHCR 푸시 (배포 방식 A-2)
#  - PR            : 빌드만 (Dockerfile 검증), 푸시 X
#  - main push/수동 : 빌드 + GHCR 푸시. 실제 배포 반영은 bambi-build 의 수동 Deploy(B-1)에서 pull
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/hk-toss-final-project/<repo> (소문자 자동)
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR 푸시는 GITHUB_TOKEN 으로 (별도 PAT 불필요)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # PR 이 아닐 때만 로그인(푸시용). PR 은 빌드 검증만.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 배포 origin 은 레포/조직 변수로 주입(레포에 URL 하드코딩 금지, CLAUDE.md §6).
          # 변수 미설정 시 빌드 통과용 http://localhost 사용 → 실제 배포 전 반드시 변수 설정.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
