<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Prototype Only] AlphaCatcher — Google 인증 분기 검수용</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/product-components.css">
<!--
  ============================================================
  [PROTOTYPE ONLY] 이 파일은 실제 제품 화면이 아닙니다.
  ============================================================
  용도: 정적 목업에서 Google OAuth 결과 분기(기존 회원 / 신규 회원 / 취소)를
        클릭으로 검수하기 위한 프로토타입 전용 화면입니다.

  제외 대상 (2026-07-14, Parami 승인):
   - Figma 최종 화면 목록 제외 (Frame 이름: N/A · 이관 제외)
   - 제품 화면 개수 제외 (product/ 15개에 포함하지 않음)
   - MCP 이관 대상 제외
   - 팀 공유용 최종 화면 · 최종 스크린샷 제외

  실제 구현 기준:
   - Google 버튼 클릭 시 이 내부 중간 화면을 거치지 않습니다.
     외부 Google OAuth 계정 선택 화면으로 바로 리다이렉트합니다.
   - 인증 성공 Callback 후 서버가 가입 여부를 판정해
     기존 회원은 홈, 신규 회원은 온보딩으로 보냅니다. 실패·취소 시 인증 화면 복귀.
   - OAuth 시작 Endpoint 후보: /oauth2/authorization/google (확정 아님 · 백엔드 협의 필요)
   - Google 공식 화면을 복제하지 않으며, AlphaCatcher 화면에서 Google 자격 증명을 입력받지 않습니다.
-->
<style>
/* 이 파일 전용 스타일 — 공유 CSS 미수정. 팀 공유용 최종 캡처 시 아래 한 줄을 주석 해제하거나
   DevTools에서 .prototype-controls{display:none}을 적용해 목업 제어 버튼을 숨길 수 있습니다. */
/* .prototype-controls{display:none;} */
.prototype-controls{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg);border:1px dashed var(--line-strong);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow);z-index:50;}
.prototype-controls .pc-label{font-family:"Space Grotesk",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-right:4px;white-space:nowrap;}
.g-spin{width:22px;height:22px;border:2.5px solid var(--wash-strong);border-top-color:var(--signal);border-radius:50%;margin:0 auto 20px;animation:gspin .9s linear infinite;}
@keyframes gspin{to{transform:rotate(360deg)}}
</style>
</head>
<body data-route-base="../product/">
<div class="page" id="page" data-theme="light">
  <div class="stage">

  <section class="screen" id="screen-google">
    <div class="app">
      <div class="auth" style="align-items:center;justify-content:center;">
        <div class="auth-form" style="text-align:center;padding:24px 0;">
          <div class="auth-orb">
            <svg width="46" height="46" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g style="fill:var(--signal)"><circle cx="16" cy="16" r="4"></circle><circle cx="19.7" cy="17.5" r="1.7"></circle><circle cx="17.5" cy="19.7" r="1.7"></circle><circle cx="14.5" cy="19.7" r="1.7"></circle><circle cx="12.3" cy="17.5" r="1.7"></circle><circle cx="12.3" cy="14.5" r="1.7"></circle><circle cx="14.5" cy="12.3" r="1.7"></circle><circle cx="17.5" cy="12.3" r="1.7"></circle><circle cx="19.7" cy="14.5" r="1.7"></circle></g><g style="fill:var(--ink)" opacity=".5"><circle cx="24" cy="18.2" r="1.2"></circle><circle cx="21.9" cy="21.9" r="1.1"></circle><circle cx="18" cy="24.1" r="1.15"></circle><circle cx="13.6" cy="23.9" r="1.2"></circle><circle cx="10" cy="21.4" r="1.1"></circle><circle cx="8" cy="17.7" r="1.1"></circle><circle cx="8.1" cy="13.3" r="1.15"></circle><circle cx="10.4" cy="9.8" r="1.15"></circle><circle cx="14.1" cy="7.9" r="1.1"></circle><circle cx="18.4" cy="8.1" r="1.05"></circle><circle cx="22" cy="10.4" r="1.15"></circle><circle cx="24" cy="14.2" r="1.1"></circle></g></svg>
          </div>
          <div class="g-spin" role="status" aria-label="이동 중"></div>
          <div class="auth-title">Google 계정으로 로그인하고 있어요</div>
          <div class="auth-sub">Google 계정 선택 화면으로 이동합니다.<br>잠시만 기다려 주세요.</div>
          <div class="auth-switch"><a data-screen="auth" data-auth="login">로그인 화면으로 돌아가기</a></div>
        </div>
      </div>

      <!-- [프로토타입 검수용] 아래 버튼들은 실제 제품 UI가 아닙니다.
           개발 흐름 검수를 위해 인증 결과 분기를 수동으로 재현하는 목업 제어 버튼이며,
           이 목적으로만 유지합니다. 실제 구현에서는 Google OAuth Callback 결과에 따라
           서버가 자동 분기하므로 이 버튼에 대응하는 제품 UI는 존재하지 않습니다.
           이 파일 자체가 최종 스크린샷·Figma 이관 대상에서 제외되므로 버튼을 숨길 필요는 없습니다. -->
      <div class="prototype-controls">
        <span class="pc-label">목업 검수용 · 실제 UI 아님</span>
        <span class="btn sm signal" data-screen="home">기존 회원으로 인증 성공</span>
        <span class="btn sm" data-screen="onboard">신규 회원으로 인증 성공</span>
        <span class="btn sm ghost" data-screen="auth" data-auth="login">로그인 취소</span>
      </div>
    </div>
  </section>

  </div>
</div>
<script src="../shared/product-common.js"></script>
</body></html>
